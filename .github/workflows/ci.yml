name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Format, Lint & Static Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./Frontend
        run: npm run lint

  unit-and-fixture-tests:
    name: Unit Tests & Language Adapters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run Backend Unit Tests
        working-directory: ./Backend
        run: npm run test:unit

  integration-tests:
    name: Integration, Worker & E2E Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Run Seed Migration
        working-directory: ./Backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/algoforge
          JWT_SECRET: ci-pipeline-jwt-secret-testing-32bytes-min
        run: node scripts/seedProblems.js

      - name: Run API Integration Tests
        working-directory: ./Backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/algoforge
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-pipeline-jwt-secret-testing-32bytes-min
        run: npm run test:integration

      - name: Run Worker Tests
        working-directory: ./Backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/algoforge
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-pipeline-jwt-secret-testing-32bytes-min
        run: npm run test:worker

      - name: Run E2E Smoke Tests
        working-directory: ./Backend
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/algoforge
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci-pipeline-jwt-secret-testing-32bytes-min
        run: npm run test:e2e

  build-artifacts:
    name: Production Build & Container Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Build Frontend Production Bundle
        working-directory: ./Frontend
        run: |
          npm ci
          npm run build

      - name: Verify Sandbox Dockerfile Build
        working-directory: ./Backend/sandbox
        run: docker build -t algoforge-sandbox:test .

  security-scan:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Backend Dependency Audit
        working-directory: ./Backend
        run: npm audit --audit-level=high

      - name: Frontend Dependency Audit
        working-directory: ./Frontend
        run: npm audit --audit-level=high
